name: Build and release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch7-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure optional stable signing
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          WATCH7_SIGNING_KEY_B64: ${{ secrets.WATCH7_SIGNING_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WATCH7_SIGNING_KEY_B64)) {
            Write-Output 'No stable signing secret configured; the build will use a runner-local development key.'
          } else {
            $key = Join-Path $env:RUNNER_TEMP 'watch7-release.p12'
            [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:WATCH7_SIGNING_KEY_B64))
            "WATCH7_SIGNING_KEY=$key" >> $env:GITHUB_ENV
          }
      - name: Compile, package and sign
        shell: pwsh
        env:
          WATCH7_SIGNING_PASSWORD: ${{ secrets.WATCH7_SIGNING_PASSWORD }}
        run: |
          ./build.ps1 -WorkRoot (Join-Path $env:RUNNER_TEMP 'watch7-guard')

      - name: Validate output
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'watch7-guard\artifacts'
          $apk = Get-ChildItem -LiteralPath $root -Filter '*.apk' -File | Select-Object -First 1
          $sum = Join-Path $root 'SHA256SUMS.txt'
          if ($null -eq $apk -or -not (Test-Path -LiteralPath $sum)) { throw 'APK or checksum was not produced.' }
          Get-Content -LiteralPath $sum

      - name: Upload Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: watch7-guard-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/watch7-guard/artifacts/*.apk
            ${{ runner.temp }}/watch7-guard/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_NAME: watch7-guard-${{ github.run_number }}
          DOWNLOAD_ROOT: ${{ runner.temp }}\watch7-guard-release
        run: |
          New-Item -ItemType Directory -Force -Path $env:DOWNLOAD_ROOT | Out-Null
          & gh run download $env:GITHUB_RUN_ID --repo $env:GH_REPO --name $env:ARTIFACT_NAME --dir $env:DOWNLOAD_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Build artifact download failed.' }

      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          DOWNLOAD_ROOT: ${{ runner.temp }}\watch7-guard-release
        run: |
          $apk = Get-ChildItem -LiteralPath $env:DOWNLOAD_ROOT -Filter '*.apk' -File | Select-Object -First 1
          $sum = Get-ChildItem -LiteralPath $env:DOWNLOAD_ROOT -Filter 'SHA256SUMS.txt' -File | Select-Object -First 1
          if ($null -eq $apk -or $null -eq $sum) { throw 'APK or checksum was not downloaded.' }
          & gh release create $env:RELEASE_TAG $apk.FullName $sum.FullName --repo $env:GH_REPO --verify-tag --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Versioned release creation failed.' }
